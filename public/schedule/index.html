<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>อีกกี่นาทีอะ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Sukhumvit Set','Leelawadee UI','Thonburi',Arial,sans-serif;
  background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 50%,#0f0f0f 100%);
  color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:32px 14px 60px
}
button,input,textarea{font-family:inherit;touch-action:manipulation}
.container{text-align:center;max-width:600px;width:100%}
.tab-bar{
  display:flex;justify-content:center;gap:4px;margin-bottom:24px;
  background:rgba(26,26,26,.7);border:1px solid rgba(139,69,19,.15);
  border-radius:14px;padding:5px;width:fit-content;margin-inline:auto
}
.tab-btn{
  font-size:.9rem;background:transparent;border:none;color:rgba(255,255,255,.55);
  padding:10px 16px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s;min-height:40px
}
.tab-btn.active{background:rgba(139,69,19,.25);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}
.day-selector{display:flex;justify-content:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.day-btn{
  font-weight:300;font-size:.85rem;
  background:rgba(255,255,255,.04);border:1px solid rgba(139,69,19,.15);color:rgba(255,255,255,.6);
  padding:8px 14px;border-radius:10px;cursor:pointer;position:relative;min-height:38px;min-width:44px
}
.day-btn.selected{background:rgba(139,69,19,.3);color:#fff;border-color:rgba(139,69,19,.5)}
.day-btn.is-today::after{
  content:'';position:absolute;bottom:4px;left:50%;translate:-50% 0;
  width:4px;height:4px;border-radius:50%;background:#e0a458
}
.timer-wrapper{margin-bottom:36px}
.timer{
  font-size:4.5rem;font-weight:300;
  font-family:'SF Mono','Fira Code','JetBrains Mono',monospace;
  display:flex;justify-content:center;align-items:center;gap:.15em;letter-spacing:-.02em
}
.digit-container{
  position:relative;height:1.2em;width:.65em;overflow:hidden;
  background:#1a1a1a;border-radius:12px;border:1px solid rgba(139,69,19,.15);box-shadow:0 2px 8px rgba(0,0,0,.4)
}
.colon{color:#8b4513;opacity:.8;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:.9}}
.digit{position:absolute;inset:0 0 auto;transition:transform .4s ease-out;display:flex;flex-direction:column;align-items:center}
.digit-number{height:1.2em;display:flex;align-items:center;justify-content:center}
.info-section{background:rgba(26,26,26,.8);border-radius:20px;padding:28px;border:1px solid rgba(139,69,19,.1);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.current-time{font-size:1.2rem;margin-bottom:14px;color:rgba(255,255,255,.7);font-weight:300}
.next-subject{font-weight:100;color:#8b4513;margin-bottom:22px;opacity:.9;font-size:1.35rem}
.reduction-section{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.reduction-section label{color:rgba(255,255,255,.6);font-size:.9rem;font-weight:200}
.reduction-input input{
  background:rgba(26,26,26,.9);border:1px solid rgba(139,69,19,.2);border-radius:10px;
  padding:10px 16px;color:#fff;font-size:1rem;width:80px;text-align:center
}
.reduction-input input:focus{outline:none;border-color:rgba(139,69,19,.4)}
.status-indicator{display:inline-block;width:8px;height:8px;background:#8b4513;border-radius:50%;margin-right:8px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
body.is-hidden .colon,
body.is-hidden .status-indicator,
body.is-hidden .pv-row.current,
body.is-hidden .pv-live-dot{animation-play-state:paused}
.card{background:rgba(26,26,26,.8);border-radius:20px;padding:24px;border:1px solid rgba(139,69,19,.1);box-shadow:0 4px 16px rgba(0,0,0,.3);text-align:left}
.card-title{font-weight:300;font-size:1.1rem;margin-bottom:16px;text-align:center}
.empty-hint{color:rgba(255,255,255,.4);font-weight:200;text-align:center;padding:14px 0}
.schedule-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.schedule-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid rgba(139,69,19,.1);border-radius:12px;padding:8px 10px}
.schedule-row input[type="time"]{
  background:rgba(0,0,0,.4);border:1px solid rgba(139,69,19,.2);border-radius:8px;
  color:#fff;padding:9px 8px;font-size:.88rem;font-family:'SF Mono',monospace;width:104px;flex-shrink:0
}
.schedule-row input[type="text"]{
  flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(139,69,19,.2);border-radius:8px;
  color:#fff;padding:9px 10px;font-size:.95rem;font-weight:300;min-width:0
}
.schedule-row input:focus{outline:none;border-color:rgba(139,69,19,.5)}
.delete-btn{
  background:transparent;border:none;color:rgba(255,255,255,.35);font-size:1.3rem;
  cursor:pointer;line-height:1;padding:6px 8px;border-radius:6px;flex-shrink:0;min-height:38px;min-width:38px
}
.delete-btn:active{color:#c0392b;background:rgba(192,57,43,.1)}
.actions-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.btn{font-size:.88rem;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid rgba(139,69,19,.25);min-height:40px}
.btn-fill{background:rgba(139,69,19,.25);color:#fff}
.btn-fill:active{background:rgba(139,69,19,.4)}
.btn-ghost{background:transparent;color:rgba(255,255,255,.5)}
.btn-ghost:active{color:#fff;border-color:rgba(255,255,255,.3)}
.io-panel{margin-top:14px;border-top:1px solid rgba(139,69,19,.12);padding-top:14px}
.io-area{
  width:100%;min-height:110px;background:rgba(0,0,0,.4);border:1px solid rgba(139,69,19,.2);
  border-radius:10px;color:rgba(255,255,255,.85);padding:10px;font-size:.78rem;
  font-family:'SF Mono',monospace;resize:vertical;margin-bottom:10px
}
.io-msg{font-weight:300;font-size:.85rem;color:#8b4513;min-height:1.2em;text-align:center}
.hidden{display:none!important}
.now-status{
  display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:300;
  color:rgba(255,255,255,.8);background:rgba(139,69,19,.12);border:1px solid rgba(139,69,19,.22);
  border-radius:12px;padding:11px 14px;margin-bottom:16px
}
.now-status b{color:#e0a458;font-weight:500}
.pv-row{
  display:flex;flex-direction:column;gap:6px;padding:13px 14px;border-radius:12px;
  border:1px solid rgba(139,69,19,.1);background:rgba(255,255,255,.02);margin-bottom:8px;
  transition:background-color .4s,border-color .4s,opacity .4s,padding-left .4s
}
.pv-row.current{
  background:rgba(139,69,19,.2);border-color:rgba(139,69,19,.5);
  border-left:3px solid #e0a458;padding-left:11px;
  animation:rowGlow 2.4s ease-in-out infinite
}
@keyframes rowGlow{0%,100%{box-shadow:0 0 0 0 rgba(224,164,88,0)}50%{box-shadow:0 0 14px 0 rgba(224,164,88,.18)}}
.pv-row.past{opacity:.38}
.pv-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pv-subject{font-weight:300;font-size:1rem}
.pv-time{font-family:'SF Mono',monospace;color:rgba(255,255,255,.55);font-size:.78rem;flex-shrink:0}
.pv-live-tag{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:500;letter-spacing:.03em;color:#e0a458;text-transform:uppercase}
.pv-live-dot{width:6px;height:6px;border-radius:50%;background:#e0a458;animation:pulse 2s ease-in-out infinite;flex-shrink:0}
.pv-bar-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pv-bar-fill{height:100%;background:#e0a458;border-radius:2px;width:0%}
@media(max-width:480px){
  .timer{font-size:3.1rem}
  .info-section,.card{padding:18px}
  .schedule-row{flex-wrap:wrap}
  .schedule-row input[type="text"]{width:100%;order:3}
  .tab-btn{font-size:.82rem;padding:9px 12px}
}
@media(prefers-reduced-motion:reduce){
  .colon,.status-indicator,.pv-row.current,.pv-live-dot{animation:none}
  .digit,.pv-row,.pv-bar-fill{transition:none!important}
}
</style>
</head>
<body>
<div class="container">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="timer">นับถอยหลัง</button>
    <button class="tab-btn" data-tab="today">วันนี้</button>
    <button class="tab-btn" data-tab="schedule">ตารางเรียน</button>
  </div>

  <div class="tab-panel active" id="panel-timer">
    <div class="timer-wrapper">
      <div class="timer">
        <div class="digit-container" id="h1"></div>
        <div class="digit-container" id="h2"></div>
        <div class="colon">:</div>
        <div class="digit-container" id="m1"></div>
        <div class="digit-container" id="m2"></div>
        <div class="colon">:</div>
        <div class="digit-container" id="s1"></div>
        <div class="digit-container" id="s2"></div>
      </div>
    </div>
    <div class="info-section">
      <div class="current-time" id="currentTime"></div>
      <div class="next-subject" id="nextSubject"><span class="status-indicator"></span>กำลังขอข้อมูล</div>
      <div class="reduction-section">
        <label for="reductionMinutes">ลดเวลาเรียน (นาที):</label>
        <div class="reduction-input"><input type="number" id="reductionMinutes" value="0" min="0" max="30"></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-today">
    <div class="day-selector" id="todayDaySelector"></div>
    <div class="card">
      <div class="card-title">ตารางทั้งวัน</div>
      <div class="now-status hidden" id="nowStatus"></div>
      <div id="todayList"></div>
    </div>
  </div>

  <div class="tab-panel" id="panel-schedule">
    <div class="day-selector" id="scheduleDaySelector"></div>
    <div class="card">
      <div class="card-title">แก้ไขวิชาและเวลาเริ่มของแต่ละคาบ</div>
      <div class="schedule-list" id="scheduleList"></div>
      <div class="actions-row">
        <button class="btn btn-fill" id="addRowBtn">+ เพิ่มคาบเรียน</button>
        <button class="btn btn-ghost" id="resetBtn">รีเซ็ตวันนี้เป็นค่าเริ่มต้น</button>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost" id="exportBtn">ส่งออกตาราง</button>
        <button class="btn btn-ghost" id="importBtn">นำเข้าตาราง</button>
      </div>
      <div class="io-panel hidden" id="exportPanel">
        <textarea class="io-area" id="exportArea" readonly></textarea>
        <div class="actions-row"><button class="btn btn-fill" id="copyBtn">คัดลอก</button></div>
        <div class="io-msg" id="exportMsg"></div>
      </div>
      <div class="io-panel hidden" id="importPanel">
        <textarea class="io-area" id="importArea" placeholder="วางข้อความตารางที่ส่งออกไว้ที่นี่"></textarea>
        <div class="actions-row"><button class="btn btn-fill" id="applyImportBtn">นำเข้า</button></div>
        <div class="io-msg" id="importMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
window.onload=()=>{
  const DAY_KEYS=[1,2,3,4,5]
  const DAY_SHORT={1:'จ',2:'อ',3:'พ',4:'พฤ',5:'ศ'}
  const DAY_FULL={1:'วันจันทร์',2:'วันอังคาร',3:'วันพุธ',4:'วันพฤหัสบดี',5:'วันศุกร์'}

  const DEFAULT={
    1:[{time:"08:20",subject:"คณิตฯ (เพิ่ม) (334)"},{time:"09:15",subject:"ต้านทุจริต (421)"},{time:"10:10",subject:"วิทย์โลกและอวกาศ (526)"},{time:"12:00",subject:"พักรับประทานอาหารกลางวัน"},{time:"12:55",subject:"ฟิสิกส์ (428)"},{time:"13:50",subject:"ไทย (215)"}],
    2:[{time:"08:20",subject:"ฟิสิกส์ - ไพรินทร์ (428)"},{time:"10:10",subject:"EnglishLS (543)"},{time:"11:05",subject:"คณิตฯ (เพิ่ม) (334)"},{time:"12:00",subject:"พักรับประทานอาหารกลางวัน"},{time:"12:55",subject:"สังคม (338)"},{time:"13:50",subject:"แนะแนว (ห้องแนะแนว)"},{time:"14:45",subject:"เคมี (438)"}],
    3:[{time:"08:20",subject:"สังคม (338)"},{time:"09:15",subject:"ฟิสิกส์ (428)"},{time:"10:10",subject:"คณิตฯ พื้น (331)"},{time:"11:05",subject:"คณิตฯ เพิ่ม (334)"},{time:"13:00",subject:"พักรับประทานอาหารกลางวัน"},{time:"12:55",subject:"ชีวะฯ - อำพร (435)"},{time:"13:45",subject:"สุขศึกษา - พิมพ์พิมล (535)"}],
    4:[{time:"08:20",subject:"การงาน (ห้องคหกรรม)"},{time:"09:15",subject:"ไทย (215)"},{time:"10:10",subject:"ชีวะฯ (435)"},{time:"11:05",subject:"ดาราศาสตร์ (เพิ่ม) (546)"},{time:"12:00",subject:"พักรับประทานอาหารกลางวัน"},{time:"12:55",subject:"คณิตฯ (พื้นฐาน) (331)"},{time:"13:50",subject:"นาฏศิลป์ (นาฏศิลป์ 1)"},{time:"14:45",subject:"อังกฤษ (223)"}],
    5:[{time:"08:20",subject:"เคมี (438)"},{time:"10:10",subject:"หน้าที่พลเมือง (335)"},{time:"11:05",subject:"คณิตฯ (เพิ่ม) (334)"},{time:"12:00",subject:"พักรับประทานอาหารกลางวัน"},{time:"12:55",subject:"อังกฤษ (223)"},{time:"13:50",subject:"ชุมนุม/ชมรม"},{time:"14:45",subject:"คุณธรรม"}]
  }

  const cloneDefault=()=>{
    const o={}
    DAY_KEYS.forEach(d=>{o[d]=DEFAULT[d].map(it=>({...it}))})
    return o
  }

  const isValid=o=>{
    if(!o||typeof o!=='object') return false
    return DAY_KEYS.every(d=>Array.isArray(o[d])&&o[d].every(it=>it&&typeof it.time==='string'&&typeof it.subject==='string'))
  }

  const SCHEMA_VER='2'
  const loadSchedule=()=>{
    if(localStorage.getItem('scheduleVersion')!==SCHEMA_VER){
      const d=cloneDefault()
      localStorage.setItem('scheduleByDay',JSON.stringify(d))
      localStorage.setItem('scheduleVersion',SCHEMA_VER)
      return d
    }
    try{
      const p=JSON.parse(localStorage.getItem('scheduleByDay'))
      if(isValid(p)) return p
    }catch(e){}
    const d=cloneDefault()
    localStorage.setItem('scheduleByDay',JSON.stringify(d))
    return d
  }

  let sched=loadSchedule()
  const saveSched=()=>localStorage.setItem('scheduleByDay',JSON.stringify(sched))

  const weekdayOrMon=()=>{const d=new Date().getDay();return d>=1&&d<=5?d:1}
  let schedDay=weekdayOrMon()
  let todayDay=weekdayOrMon()

  const sortByTime=list=>[...list].sort((a,b)=>a.time.localeCompare(b.time))
  const parseOnDate=(date,t)=>{const[h,m]=t.split(':').map(Number);const d=new Date(date);d.setHours(h,m,0,0);return d}
  const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d}
  const noMotion=()=>matchMedia('(prefers-reduced-motion:reduce)').matches
  const msToNextMin=now=>60000-(now.getSeconds()*1000+now.getMilliseconds())
  const msToMidnight=now=>{const m=new Date(now);m.setHours(24,0,0,0);return m-now}
  const el=id=>document.getElementById(id)

  let activeTab='timer'
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'))
      btn.classList.add('active')
      el('panel-'+btn.dataset.tab).classList.add('active')
      activeTab=btn.dataset.tab
      startTimer()
    })
  })

  const buildDaySelector=(container,sel,onSelect)=>{
    container.innerHTML=''
    const wd=new Date().getDay()
    DAY_KEYS.forEach(d=>{
      const b=document.createElement('button')
      b.className='day-btn'+(d===sel?' selected':'')+(d===wd?' is-today':'')
      b.textContent=DAY_SHORT[d]
      b.addEventListener('click',()=>onSelect(d))
      container.appendChild(b)
    })
  }

  const schedListEl=el('scheduleList')
  const schedDaySel=el('scheduleDaySelector')

  const renderSchedDaySelector=()=>buildDaySelector(schedDaySel,schedDay,d=>{schedDay=d;renderSchedDaySelector();renderSchedEditor()})

  const renderSchedEditor=()=>{
    const list=sched[schedDay]||[]
    schedListEl.innerHTML=''
    if(!list.length){
      const h=document.createElement('div')
      h.className='empty-hint'
      h.textContent='ยังไม่มีคาบเรียนของ'+DAY_FULL[schedDay]+' กดปุ่มด้านล่างเพื่อเพิ่ม'
      schedListEl.appendChild(h)
      return
    }
    list.forEach((item,i)=>{
      const row=document.createElement('div')
      row.className='schedule-row'

      const ti=document.createElement('input')
      ti.type='time';ti.value=item.time
      ti.addEventListener('change',e=>{sched[schedDay][i].time=e.target.value;saveSched();renderSchedEditor()})

      const si=document.createElement('input')
      si.type='text';si.value=item.subject;si.placeholder='ชื่อวิชา'
      si.addEventListener('input',e=>{sched[schedDay][i].subject=e.target.value;saveSched()})

      const db=document.createElement('button')
      db.className='delete-btn';db.textContent='×'
      db.addEventListener('click',()=>{sched[schedDay].splice(i,1);saveSched();renderSchedEditor()})

      row.append(ti,si,db)
      schedListEl.appendChild(row)
    })
  }

  el('addRowBtn').addEventListener('click',()=>{
    sched[schedDay]??=[]
    sched[schedDay].push({time:"08:00",subject:"วิชาใหม่"})
    saveSched();renderSchedEditor()
  })

  el('resetBtn').addEventListener('click',()=>{
    if(!confirm('รีเซ็ตตารางของ'+DAY_FULL[schedDay]+'กลับเป็นค่าเริ่มต้น?')) return
    sched[schedDay]=DEFAULT[schedDay].map(it=>({...it}))
    saveSched();renderSchedEditor()
  })

  const exportPanel=el('exportPanel'),importPanel=el('importPanel')
  const exportArea=el('exportArea'),exportMsg=el('exportMsg')
  const importArea=el('importArea'),importMsg=el('importMsg')

  el('exportBtn').addEventListener('click',()=>{
    importPanel.classList.add('hidden')
    exportPanel.classList.toggle('hidden')
    if(!exportPanel.classList.contains('hidden')){exportArea.value=JSON.stringify(sched,null,2);exportMsg.textContent=''}
  })

  el('importBtn').addEventListener('click',()=>{
    exportPanel.classList.add('hidden')
    importPanel.classList.toggle('hidden')
    importMsg.textContent=''
  })

  el('copyBtn').addEventListener('click',()=>{
    const done=()=>{exportMsg.textContent='คัดลอกแล้ว ✓'}
    if(navigator.clipboard?.writeText&&window.isSecureContext)
      navigator.clipboard.writeText(exportArea.value).then(done).catch(()=>{exportArea.select();document.execCommand('copy');done()})
    else{exportArea.select();exportArea.setSelectionRange(0,99999);try{document.execCommand('copy');done()}catch{exportMsg.textContent='คัดลอกไม่สำเร็จ กรุณาเลือกข้อความเอง'}}
  })

  el('applyImportBtn').addEventListener('click',()=>{
    let p
    try{p=JSON.parse(importArea.value)}catch{importMsg.textContent='ข้อความไม่ใช่รูปแบบ JSON ที่ถูกต้อง';return}
    if(!isValid(p)){importMsg.textContent='โครงสร้างข้อมูลไม่ถูกต้อง';return}
    if(!confirm('นำเข้าตารางนี้แทนตารางปัจจุบันทั้งหมด?')) return
    sched=p;saveSched();renderSchedEditor();renderTodayView()
    importMsg.textContent='นำเข้าสำเร็จ ✓'
  })

  const todayDaySel=el('todayDaySelector')
  const todayListEl=el('todayList')
  const nowStatusEl=el('nowStatus')
  let todayTid=null
  const clearTodayTimer=()=>{if(todayTid){clearTimeout(todayTid);todayTid=null}}

  const renderTodayDaySelector=()=>buildDaySelector(todayDaySel,todayDay,d=>{todayDay=d;renderTodayDaySelector();renderTodayView()})

  const renderTodayView=()=>{
    clearTodayTimer()
    const now=new Date()
    const isLive=todayDay===now.getDay()
    const list=sortByTime(sched[todayDay]||[])
    todayListEl.innerHTML='';nowStatusEl.innerHTML='';nowStatusEl.classList.add('hidden')

    if(!list.length){
      const h=document.createElement('div')
      h.className='empty-hint';h.textContent='ยังไม่มีคาบเรียนของ'+DAY_FULL[todayDay]
      todayListEl.appendChild(h);return
    }

    const reduce=+reductionInput.value||0
    const computed=list.map((item,i)=>{
      const start=parseOnDate(now,item.time)
      start.setMinutes(start.getMinutes()-reduce)
      const nxt=list[i+1]
      const end=nxt?(()=>{const e=parseOnDate(now,nxt.time);e.setMinutes(e.getMinutes()-reduce);return e})():new Date(start.getTime()+55*60000)
      return {subject:item.subject,time:start.toLocaleTimeString('th-TH',{hour12:false,hour:'2-digit',minute:'2-digit'}),start,end}
    })

    let curIdx=-1,nextBoundary=null
    if(isLive){
      if(now<computed[0].start) nextBoundary=computed[0].start
      else if(now<computed.at(-1).end){
        curIdx=computed.findIndex(c=>now>=c.start&&now<c.end)
        if(curIdx!==-1) nextBoundary=computed[curIdx].end
      }
    }

    computed.forEach((c,i)=>{
      const row=document.createElement('div')
      row.className='pv-row'
      const isCur=i===curIdx
      const isPast=isLive&&!isCur&&c.end<=now
      if(isCur) row.classList.add('current')
      if(isPast) row.classList.add('past')

      if(isCur){
        const tag=document.createElement('div')
        tag.className='pv-live-tag'
        tag.innerHTML='<span class="pv-live-dot"></span>กำลังเรียนอยู่'
        row.appendChild(tag)
      }

      const top=document.createElement('div');top.className='pv-top'
      const subj=document.createElement('div');subj.className='pv-subject'
      subj.textContent=(isPast?'✓ ':'')+c.subject
      const time=document.createElement('div');time.className='pv-time';time.textContent=c.time
      top.append(subj,time);row.appendChild(top)

      if(isCur){
        const track=document.createElement('div');track.className='pv-bar-track'
        const fill=document.createElement('div');fill.className='pv-bar-fill'
        fill.style.cssText=`transition:none;width:${Math.min(100,Math.max(0,(now-c.start)/(c.end-c.start)*100))}%`
        track.appendChild(fill);row.appendChild(track)
        if(!noMotion()) requestAnimationFrame(()=>requestAnimationFrame(()=>{
          fill.style.transition=`width ${Math.max(0,c.end-Date.now())}ms linear`
          fill.style.width='100%'
        }))
      }
      todayListEl.appendChild(row)
    })

    if(isLive){
      nowStatusEl.classList.remove('hidden')
      if(curIdx!==-1){
        const c=computed[curIdx]
        nowStatusEl.innerHTML=`<span class="pv-live-dot"></span>กำลังเรียน <b>${c.subject}</b> · เหลืออีก ${Math.max(1,Math.ceil((c.end-now)/60000))} นาที`
      }else if(now<computed[0].start){
        nowStatusEl.textContent=`ยังไม่เริ่ม · คาบแรกอีก ${Math.max(1,Math.ceil((computed[0].start-now)/60000))} นาที (${computed[0].time})`
      }else{
        nowStatusEl.textContent='หมดคาบเรียนสำหรับวันนี้แล้ว 🎉'
      }
    }

    const wakeMs=nextBoundary?Math.min(nextBoundary-now,msToNextMin(now)):isLive?msToMidnight(now):null
    if(wakeMs!=null&&activeTab==='today'&&!document.hidden)
      todayTid=setTimeout(renderTodayView,Math.max(1000,wakeMs))
  }

  const reductionInput=el('reductionMinutes')
  reductionInput.value=localStorage.getItem('reductionMinutes')||'0'

  const digitEls={h1:el('h1'),h2:el('h2'),m1:el('m1'),m2:el('m2'),s1:el('s1'),s2:el('s2')}
  const prevDigits={}

  const mkDigit=()=>{
    const d=document.createElement('div');d.className='digit'
    for(let i=0;i<10;i++){const n=document.createElement('div');n.className='digit-number';n.textContent=i;d.appendChild(n)}
    return d
  }
  Object.entries(digitEls).forEach(([k,c])=>{c.appendChild(mkDigit());prevDigits[k]=-1})

  const setDigit=(k,v)=>{
    if(prevDigits[k]===v) return
    prevDigits[k]=v
    digitEls[k].querySelector('.digit').style.transform=`translateY(${-v*1.2}em)`
  }

  const findCurrentAndNext=()=>{
    const now=new Date()
    const wd=now.getDay()
    const reduce=+reductionInput.value||0

    if(wd>=1&&wd<=5){
      const list=sortByTime(sched[wd]||[])
      const pts=list.map((c,i)=>{
        const s=parseOnDate(now,c.time);s.setMinutes(s.getMinutes()-reduce)
        const nx=list[i+1]
        const e=nx?(()=>{const x=parseOnDate(now,nx.time);x.setMinutes(x.getMinutes()-reduce);return x})():new Date(s.getTime()+55*60000)
        return {subject:c.subject,start:s,end:e}
      })
      const ci=pts.findIndex(c=>now>=c.start&&now<c.end)
      if(ci!==-1){
        const cur=pts[ci],nxt=pts[ci+1]
        return nxt?{current:cur.subject,next:nxt.subject,time:nxt.start}:{current:cur.subject,next:null,time:cur.end}
      }
      for(const c of pts) if(c.start>now) return {current:null,next:c.subject,time:c.start}
    }

    let cursor=now
    for(let i=0;i<7;i++){
      cursor=addDays(cursor,1)
      const wd=cursor.getDay()
      if(wd<1||wd>5) continue
      const list=sortByTime(sched[wd]||[])
      if(!list.length) continue
      const s=parseOnDate(cursor,list[0].time);s.setMinutes(s.getMinutes()-reduce)
      return {current:null,next:list[0].subject,time:s}
    }
    return {current:null,next:'ไม่มีตารางเรียนที่ตั้งไว้',time:null}
  }

  const currentTimeEl=el('currentTime')
  const nextSubjectEl=el('nextSubject')
  const fmt=t=>t.toLocaleTimeString('th-TH',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})
  const zero6=()=>['h1','h2','m1','m2','s1','s2'].forEach(k=>setDigit(k,0))

  const updateCountdown=()=>{
    const now=new Date()
    const {current,next,time}=findCurrentAndNext()
    currentTimeEl.textContent=fmt(now)+(time?' -> '+fmt(time):'')
    nextSubjectEl.innerHTML=`<span class="status-indicator"></span>${current?'กำลังเรียน '+current:next||'ไม่มีตารางเรียน'}`
    if(!time||time-now<=0){zero6();return}
    const diff=time-now
    const hh=String(Math.floor(diff/36e5)).padStart(2,'0')
    const mm=String(Math.floor(diff%36e5/6e4)).padStart(2,'0')
    const ss=String(Math.floor(diff%6e4/1e3)).padStart(2,'0')
    setDigit('h1',+hh[0]);setDigit('h2',+hh[1])
    setDigit('m1',+mm[0]);setDigit('m2',+mm[1])
    setDigit('s1',+ss[0]);setDigit('s2',+ss[1])
  }

  reductionInput.addEventListener('input',e=>{
    localStorage.setItem('reductionMinutes',e.target.value||'0')
    if(activeTab==='timer') updateCountdown()
    else if(activeTab==='today') renderTodayView()
  })

  let intervalId=null
  const stopInterval=()=>{if(intervalId){clearInterval(intervalId);intervalId=null}}
  const stopAll=()=>{stopInterval();clearTodayTimer()}

  const startTimer=()=>{
    stopAll()
    if(document.hidden) return
    if(activeTab==='timer'){updateCountdown();intervalId=setInterval(updateCountdown,1000)}
    else if(activeTab==='today') renderTodayView()
  }

  document.addEventListener('visibilitychange',()=>{
    document.body.classList.toggle('is-hidden',document.hidden)
    document.hidden?stopAll():startTimer()
  })

  renderSchedDaySelector();renderSchedEditor()
  renderTodayDaySelector();renderTodayView()
  updateCountdown();startTimer()
}
</script>
</body>
</html>
